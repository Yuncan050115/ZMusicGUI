name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: ./gradlew build --no-daemon -x test
      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: ZMusicGUI-jar
          path: build/libs/*.jar
          if-no-files-found: warn

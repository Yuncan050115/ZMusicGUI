lyric:
  default-enabled: true
  default-mode: BOSSBAR
  update-ticks: 10
  # 歌词显示格式:
  #   LYRIC         — 仅当前句歌词 (默认)
  #   LYRIC_SINGER  — 当前句 + 歌手 + 歌名
  #   LYRIC_NEXT    — 当前句 + 下一句 (需ZMusic支持)
  #   FULL          — 全部: 歌词 + 歌手 + 歌名 + 下一句
  display-format: LYRIC

music:
  cooldown-seconds: 5
  # 是否启用全服点歌功能
  public-request: true

gui:
  # 是否显示左下角作者信息
  show-credits: true
